<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0b0e">
  <title>Vortex-Core | Cyber Glassmorphism Interface</title>
  <link rel="stylesheet" href="../assets/css/madi-cyber-theme.css">
</head>
<body>

  <div class="madi-app-container">
    <header class="cyber-card center" role="banner">
      <h1 class="kicker">Vortex-Core</h1>
      <p class="muted">Cyber Glassmorphism Interface — lightweight PWA-ready theme</p>
      <div style="margin-top:0.5rem; display:flex; gap:0.5rem; justify-content:center">
        <button id="toggle-low-power" aria-pressed="false" aria-label="Toggle low power mode">Low Power</button>
        <button id="toggle-high-contrast" aria-pressed="false" aria-label="Toggle high contrast">High Contrast</button>
      </div>
    </header>

    <main class="cyber-card neural-panel" role="main">
      <h3>Neural Shield & Predictions (Neural Engine)</h3>
      <div id="neural-digest-container" aria-live="polite">Syncing focus state...</div>
    </main>

    <nav class="madi-tab-bar" role="navigation" aria-label="Primary">
      <a href="#" aria-label="Home" title="Home">Home</a>
      <a href="#" aria-label="Nodes" title="Nodes">Nodes</a>
      <a href="#" aria-label="Settings" title="Settings">Settings</a>
    </nav>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
