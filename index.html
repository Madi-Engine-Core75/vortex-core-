<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex-Core | Cyber Ecosystem</title>
  
  <!-- ربط ملف التصميم السيبراني الموحد -->
  <link rel="stylesheet" href="./assets/css/madi-cyber-theme.css">

  <!-- كود فحص الأداء التكيفي (Performance Guard) للهواتف الاقتصادية -->
  <script>
    (function () {
      const isLowEndDevice = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
      if (isLowEndDevice) {
        document.documentElement.classList.add('low-end-mode');
        const style = document.createElement('style');
        style.innerHTML = `
          .cyber-card, .madi-tab-bar, .cyber-node {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            background: #12141c !important;
          }
        `;
        document.head.appendChild(style);
        console.info("[MadiEngineCore] Low-end device detected: Adaptive UI optimization applied.");
      }
    })();
  </script>
</head>
<body>

  <!-- حاوية التطبيق الرئيسية -->
  <div class="madi-app-container">
    
    <!-- قسم غرف الواقع السيبراني المصغر -->
    <div class="cyber-space-container">
      <h3 class="glow-teal" style="margin-bottom: 10px; font-size: 14px;">Cyber Glassmorphism Spaces</h3>
      
      <div class="nodes-network">
        <!-- العقدة الأولى -->
        <div class="cyber-node node-1">
          <span style="font-size: 16px;">🧠</span>
          <span>AI-Fork</span>
        </div>

        <!-- العقدة الثانية -->
        <div class="cyber-node node-2">
          <span style="font-size: 16px;">⚡</span>
          <span>Neuro-Core</span>
        </div>

        <!-- العقدة الرئيسية -->
        <div class="cyber-node node-main">
          <span style="font-size: 20px;">🛡️</span>
          <span style="color: var(--accent-gold);">Main R&D</span>
        </div>

        <!-- العقدة الثالثة -->
        <div class="cyber-node node-3">
          <span style="font-size: 16px;">💬</span>
          <span>Encrypted</span>
        </div>
      </div>
    </div>

    <!-- لوحة معلومات الحماية المجتمعية -->
    <div class="cyber-card" style="margin-top: -10px;">
      <p style="font-size: 12px; color: var(--text-secondary);">Community Immunity: <span class="glow-teal">Active (Level 5)</span></p>
      <p style="font-size: 12px; color: var(--text-secondary); margin-top: 5px;">Encryption: <span class="glow-teal">AES-256-GCM Active</span></p>
    </div>

  </div>

  <!-- شريط التنقل السفلي السيبراني -->
  <nav class="madi-tab-bar">
    <span class="glow-teal">⬡ دوائر</span>
    <span class="glow-teal">💬 محادثات</span>
    <span class="glow-teal">⚡ مساحات</span>
    <span class="glow-teal">🛡️ سمعة</span>
  </nav>

</body>
</html>
